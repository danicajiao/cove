        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: services/cove-user
          push: false
          build-args: COMMIT_SHA=${{ github.sha }}

  # ── packages/imgproxy ─────────────────────────────────────────────────────
  packages-imgproxy:
    name: packages/imgproxy
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: packages/imgproxy/go.mod
          # No external deps → no go.sum, so dependency caching has nothing to key on.
          cache: false

      - name: Run tests
        working-directory: packages/imgproxy
        run: go test ./...

      - name: Run vet
        working-directory: packages/imgproxy
        run: go vet ./...

  # ── bump-overlay-tags ─────────────────────────────────────────────────────
  bump-overlay-tags:
    name: Open homelab PR — bump overlay tags
    runs-on: ubuntu-latest
    needs: [cove-api, cove-media, cove-catalog, cove-directory, cove-user, packages-imgproxy]
    # Only runs after a successful image push — same gate as the push steps above.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'

    permissions:
      contents: read

    steps:
      - name: Checkout homelab
        uses: actions/checkout@v6
        with:
          repository: danicajiao/homelab
          token: ${{ secrets.HOMELAB_PAT }}

      - name: Bump overlay image tags and open PR
        env:
          GH_TOKEN: ${{ secrets.HOMELAB_PAT }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          GIT_REF: ${{ github.ref }}
        run: |
          SHORT_SHA="${COMMIT_SHA:0:8}"
          NEW_TAG="sha-${COMMIT_SHA}"
          # Every deployed service built above. Each needs an `images:` entry
          # in every overlay, or its Deployment keeps the base tag.
          SERVICES="cove-api cove-media cove-catalog cove-directory cove-user"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # On main: update both staging and prod overlays in one PR so they
          # are always in sync after a release. On any other branch (e.g. an
          # integration branch workflow_dispatch): staging only for validation.
          if [ "$GIT_REF" = "refs/heads/main" ]; then
            OVERLAYS="apps/cove/overlays/staging/kustomization.yaml apps/cove/overlays/prod/kustomization.yaml"
            BRANCH="deploy/cove-prod-sha-${SHORT_SHA}"
            ENV_LABEL="staging + prod"
          else
            OVERLAYS="apps/cove/overlays/staging/kustomization.yaml"
            BRANCH="deploy/cove-staging-sha-${SHORT_SHA}"
            ENV_LABEL="staging"
          fi

          # Checkout the branch before running sed so the working tree is clean.
          # If the remote branch already exists (e.g. a CI re-run for the same
          # commit), fetch it and base our local branch on top so the push isn't
          # rejected. If it doesn't exist yet, create a fresh branch as normal.
          if git ls-remote --exit-code origin "refs/heads/${BRANCH}" > /dev/null 2>&1; then
            git fetch origin "${BRANCH}"
            git checkout -b "${BRANCH}" "origin/${BRANCH}"
          else
            git checkout -b "${BRANCH}"
          fi

          # Fail before touching anything if an overlay doesn't pin one of the
          # services — the sed below only rewrites tags that already exist, so
          # a missing entry would silently deploy the base tag instead.
          MISSING=""
          for f in $OVERLAYS; do
            for svc in $SERVICES; do
              grep -q "name: us-central1-docker.pkg.dev/cove-6a685/services/${svc}$" "$f" \
                || MISSING="${MISSING} ${f}:${svc}"
            done
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Overlay images entries missing for:${MISSING}"
            exit 1
          fi

          # Rewrite the tag on every `newTag: sha-...` line. Match any run of
          # non-whitespace after `sha-` (not just hex) so first-deploy
          # placeholders like `sha-placeholder` are replaced cleanly — a hex-only
          # class would match zero chars before `placeholder` and corrupt it.
          for f in $OVERLAYS; do
            sed -i "s|newTag: sha-[^[:space:]]*|newTag: ${NEW_TAG}|g" "$f"
          done

          git add $OVERLAYS
          # Skip the commit if the re-run produced no diff (tags already at this SHA).
          git diff --cached --quiet || git commit -m "Bump cove services to sha-${SHORT_SHA} (${ENV_LABEL})"
          git push origin "${BRANCH}"

          {
            echo "## Deploy — ${ENV_LABEL}"
            echo ""
            echo "Bumps all cove services to \`${NEW_TAG}\`."
            echo ""
            echo "| Overlay | Service | New tag |"
            echo "|---|---|---|"
            for f in $OVERLAYS; do
              ENV=$(echo "$f" | grep -o 'staging\|prod')
              for svc in $SERVICES; do
                echo "| \`${ENV}\` | \`${svc}\` | \`${NEW_TAG}\` |"
              done
            done
            echo ""
            echo "**Source:** [danicajiao/cove@${SHORT_SHA}](https://github.com/danicajiao/cove/commit/${COMMIT_SHA})"
            echo "**CI run:** https://github.com/danicajiao/cove/actions/runs/${RUN_ID}"
            echo ""
            echo "## Checklist"
            echo "- [ ] CI green on source commit"
            echo "- [ ] No unexpected manifest changes in diff"
          } > /tmp/pr-body.md

          # Only open a new PR if one doesn't already exist for this branch.
          # On re-runs the branch is updated above, but we don't need a second
          # PR — the existing one already tracks the updated branch.
          EXISTING_PR=$(gh pr list \
            --repo danicajiao/homelab \
            --head "${BRANCH}" \
            --json url \
            --jq '.[0].url // ""')
          if [ -n "$EXISTING_PR" ]; then
            echo "Branch updated. PR already open: ${EXISTING_PR}"
          else
            gh pr create \
              --repo danicajiao/homelab \
              --title "Bump cove services to SHA \`${SHORT_SHA}\`" \
              --body-file /tmp/pr-body.md \
              --base main \
              --head "${BRANCH}"
          fi
