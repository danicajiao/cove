name: CI - Services (Go)

on:
  push:
    branches:
      - main
    paths:
      - 'services/cove-api/**'
      - 'services/cove-media/**'
      - 'services/cove-catalog/**'
      - 'services/cove-directory/**'
      - 'services/cove-user/**'
      - 'packages/imgproxy/**'
      - '.github/workflows/ci-services.yml'
  pull_request:
    paths:
      - 'services/cove-api/**'
      - 'services/cove-media/**'
      - 'services/cove-catalog/**'
      - 'services/cove-directory/**'
      - 'services/cove-user/**'
      - 'packages/imgproxy/**'
      - '.github/workflows/ci-services.yml'
  # Allows manually triggering a build+push from any branch.
  # Useful for bootstrapping GAR before the integration branch merges to main,
  # or for emergency re-deploys.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── cove-api ──────────────────────────────────────────────────────────────
  cove-api:
    name: cove-api
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # Required for Workload Identity Federation

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/cove-api/go.mod
          cache-dependency-path: services/cove-api/go.sum

      - name: Run tests
        working-directory: services/cove-api
        run: go test ./...

      - name: Run vet
        working-directory: services/cove-api
        run: go vet ./...

      # Authenticate to GCP using Workload Identity Federation.
      # Runs on pushes to main and on manual workflow_dispatch triggers.
      # Does not run on PRs — PRs only build the image to verify it compiles.
      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push image (main / manual)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v7
        with:
          context: services/cove-api
          push: true
          tags: us-central1-docker.pkg.dev/cove-6a685/services/cove-api:sha-${{ github.sha }}
          build-args: COMMIT_SHA=${{ github.sha }}

      # On PRs: build only (no push) to verify the Dockerfile and that the
      # service still compiles. The image is not tagged or stored.
      - name: Build image (PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: services/cove-api
          push: false
          build-args: COMMIT_SHA=${{ github.sha }}

  # ── cove-media ────────────────────────────────────────────────────────────
  cove-media:
    name: cove-media
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # Required for Workload Identity Federation

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/cove-media/go.mod
          cache-dependency-path: services/cove-media/go.sum

      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-dev

      - name: Run tests
        working-directory: services/cove-media
        run: go test ./...

      - name: Run vet
        working-directory: services/cove-media
        run: go vet ./...

      # Authenticate to GCP using Workload Identity Federation.
      # Runs on pushes to main and on manual workflow_dispatch triggers.
      # Does not run on PRs — PRs only build the image to verify it compiles.
      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      # context is the repo root so the shared packages/imgproxy module is in
      # the build context; the service Dockerfile is selected via file:.
      - name: Build and push image (main / manual)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/cove-media/Dockerfile
          push: true
          tags: us-central1-docker.pkg.dev/cove-6a685/services/cove-media:sha-${{ github.sha }}
          build-args: COMMIT_SHA=${{ github.sha }}

      # On PRs: build only (no push) to verify the Dockerfile and that the
      # service still compiles. The image is not tagged or stored.
      - name: Build image (PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/cove-media/Dockerfile
          push: false
          build-args: COMMIT_SHA=${{ github.sha }}

  # ── cove-catalog ──────────────────────────────────────────────────────────
  cove-catalog:
    name: cove-catalog
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # Required for Workload Identity Federation

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/cove-catalog/go.mod
          cache-dependency-path: services/cove-catalog/go.sum

      - name: Run tests
        working-directory: services/cove-catalog
        run: go test ./...

      - name: Run vet
        working-directory: services/cove-catalog
        run: go vet ./...

      # Authenticate to GCP using Workload Identity Federation.
      # Runs on pushes to main and on manual workflow_dispatch triggers.
      # Does not run on PRs — PRs only build the image to verify it compiles.
      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      # context is the repo root so the shared packages/imgproxy module is in
      # the build context; the service Dockerfile is selected via file:.
      - name: Build and push image (main / manual)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/cove-catalog/Dockerfile
          push: true
          tags: us-central1-docker.pkg.dev/cove-6a685/services/cove-catalog:sha-${{ github.sha }}
          build-args: COMMIT_SHA=${{ github.sha }}

      # On PRs: build only (no push) to verify the Dockerfile and that the
      # service still compiles. The image is not tagged or stored.
      - name: Build image (PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/cove-catalog/Dockerfile
          push: false
          build-args: COMMIT_SHA=${{ github.sha }}

  # ── cove-directory ────────────────────────────────────────────────────────
  cove-directory:
    name: cove-directory
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # Required for Workload Identity Federation

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/cove-directory/go.mod
          cache-dependency-path: services/cove-directory/go.sum

      - name: Run tests
        working-directory: services/cove-directory
        run: go test ./...

      - name: Run vet
        working-directory: services/cove-directory
        run: go vet ./...

      # Authenticate to GCP using Workload Identity Federation.
      # Runs on pushes to main and on manual workflow_dispatch triggers.
      # Does not run on PRs — PRs only build the image to verify it compiles.
      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      # context is the repo root so the shared packages/imgproxy module is in
      # the build context; the service Dockerfile is selected via file:.
      - name: Build and push image (main / manual)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/cove-directory/Dockerfile
          push: true
          tags: us-central1-docker.pkg.dev/cove-6a685/services/cove-directory:sha-${{ github.sha }}
          build-args: COMMIT_SHA=${{ github.sha }}

      # On PRs: build only (no push) to verify the Dockerfile and that the
      # service still compiles. The image is not tagged or stored.
      - name: Build image (PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/cove-directory/Dockerfile
          push: false
          build-args: COMMIT_SHA=${{ github.sha }}

  # ── cove-user ─────────────────────────────────────────────────────────────
  cove-user:
    name: cove-user
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # Required for Workload Identity Federation

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/cove-user/go.mod
          cache-dependency-path: services/cove-user/go.sum

      - name: Run tests
        working-directory: services/cove-user
        run: go test ./...

      - name: Run vet
        working-directory: services/cove-user
        run: go vet ./...

      # Authenticate to GCP using Workload Identity Federation.
      # Runs on pushes to main and on manual workflow_dispatch triggers.
      # Does not run on PRs — PRs only build the image to verify it compiles.
      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push image (main / manual)
