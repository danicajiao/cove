name: CI - iOS

on:
  push:
    branches:
      - main
    paths:
      - 'apps/ios/**'
      - '!apps/ios/**/*.md'
      - '.github/workflows/ci-ios.yml'
  pull_request:
    paths:
      - 'apps/ios/**'
      - '!apps/ios/**/*.md'
      - '.github/workflows/ci-ios.yml'

jobs:
  lint-and-validate:
    name: Lint & Validate
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    defaults:
      run:
        working-directory: apps/ios

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.1'
          bundler-cache: true
          working-directory: apps/ios

      - name: Check for Swift file changes
        id: swift-changes
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '\.swift$' || true)
          if [ -z "$CHANGED" ]; then
            echo "No Swift files changed — skipping lint."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      # Pin SwiftLint to the version used locally instead of the latest
      # Homebrew release, so new upstream rules can't break lint unannounced.
      # Bump SWIFTLINT_VERSION and SWIFTLINT_SHA256 together when upgrading.
      - name: Install SwiftLint
        if: steps.swift-changes.outputs.skip != 'true'
        env:
          SWIFTLINT_VERSION: 0.63.2
          SWIFTLINT_SHA256: c59a405c85f95b92ced677a500804e081596a4cae4a6a485af76065557d6ed29
        run: |
          curl -fsSL -o "$RUNNER_TEMP/portable_swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          echo "${SWIFTLINT_SHA256}  $RUNNER_TEMP/portable_swiftlint.zip" | shasum -a 256 -c -
          unzip -oq "$RUNNER_TEMP/portable_swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          chmod +x "$RUNNER_TEMP/swiftlint/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"

      # Pin SwiftFormat to the version used locally instead of the runner's
      # preinstalled copy, so runner image updates can't introduce new rules.
      # Bump SWIFTFORMAT_VERSION and SWIFTFORMAT_SHA256 together when upgrading.
      - name: Install SwiftFormat
        if: steps.swift-changes.outputs.skip != 'true'
        env:
          SWIFTFORMAT_VERSION: 0.60.1
          SWIFTFORMAT_SHA256: 23b50c75f4223c477e822833c4cf819a1c9abbb6d00e892900bda1c3a8231afd
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          echo "${SWIFTFORMAT_SHA256}  $RUNNER_TEMP/swiftformat.zip" | shasum -a 256 -c -
          unzip -oq "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/swiftformat"
          chmod +x "$RUNNER_TEMP/swiftformat/swiftformat"
          echo "$RUNNER_TEMP/swiftformat" >> "$GITHUB_PATH"

      - name: Run SwiftFormat (lint only)
        if: steps.swift-changes.outputs.skip != 'true'
        run: |
          swiftformat --version
          swiftformat --lint .

      - name: Run SwiftLint
        if: steps.swift-changes.outputs.skip != 'true'
        run: |
          swiftlint version
          swiftlint lint --strict

      - name: Check for merge conflict markers
        if: steps.swift-changes.outputs.skip != 'true'
        run: |
          if grep -r "^<<<<<<< \|^=======$\|^>>>>>>> " Cove/ --include="*.swift"; then
            echo "❌ Merge conflict markers found!"
            exit 1
          fi
          echo "✓ No merge conflict markers"

      - name: Validate Info.plist
        run: |
          plutil -lint "Cove/Supporting Files/Info.plist"
          echo "✓ Info.plist is valid"

  build-and-test:
    name: Build and Test
    if: github.event_name == 'push'
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      # fastlane runs `xcodebuild -showBuildSettings` before building, which
      # resolves Swift packages on a cold runner. Its default (3s, doubling over
      # 4 tries) times out on macos-26; start at 30s instead.
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "30"
      FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "4"
    defaults:
      run:
        working-directory: apps/ios

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.1'
          bundler-cache: true
          working-directory: apps/ios

      - name: Build iOS app
        run: bundle exec fastlane build

      - name: Run tests
        run: bundle exec fastlane test
        continue-on-error: true
