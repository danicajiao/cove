name: CI - OpenAPI Lint

on:
  pull_request:
    paths:
      - 'services/cove-api/api/**'
      - 'services/cove-media/api/**'
      - 'services/cove-catalog/api/**'
      - 'services/cove-directory/api/**'
      - 'services/cove-user/api/**'
      - '.github/workflows/ci-openapi.yml'

jobs:
  lint:
    name: Lint OpenAPI spec
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Redocly CLI
        run: npm install -g @redocly/cli@latest

      - name: Lint cove-api openapi.yaml
        run: redocly lint --config services/cove-api/redocly.yaml services/cove-api/api/openapi.yaml

      - name: Lint cove-media openapi.yaml
        run: redocly lint --config services/cove-media/redocly.yaml services/cove-media/api/openapi.yaml

      - name: Lint cove-catalog openapi.yaml
        run: redocly lint --config services/cove-catalog/redocly.yaml services/cove-catalog/api/openapi.yaml

      - name: Lint cove-directory openapi.yaml
        run: redocly lint --config services/cove-directory/redocly.yaml services/cove-directory/api/openapi.yaml

      - name: Lint cove-user openapi.yaml
        run: redocly lint --config services/cove-user/redocly.yaml services/cove-user/api/openapi.yaml
