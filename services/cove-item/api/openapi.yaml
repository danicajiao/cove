openapi: "3.1.0"

info:
  title: cove-item
  version: "0.1.0"
  description: |
    Discovery surface for the Cove platform.
    Handles category browsing, item/producer/place detail, and the core
    trust+proximity+relevance discovery query.

    Authentication: this service does NOT validate Firebase tokens directly.
    It trusts the X-Cove-Uid header injected by the upstream cove-api gateway.
    All endpoints (except /health) reject requests missing this header.

    Image URLs in responses are pre-signed imgproxy URLs. Each URL embeds an
    exp: processing option and is valid for 1 hour (configurable via
    IMGPROXY_URL_TTL). Clients should not cache these URLs beyond their expiry.

servers:
  - url: http://cove-item.cove-item.svc.cluster.local:8080
    description: In-cluster (default)
  - url: http://localhost:8080
    description: Local development

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      description: |
        Returns service name, status, and Git commit SHA.
        Unauthenticated — used by Kubernetes liveness/readiness probes.
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /discovery:
    get:
      operationId: getDiscovery
      summary: Discover items
      description: |
        The core discovery query. Ranks items by a blended score:
          score = 0.40 × trust + 0.30 × text_relevance + 0.30 × proximity

        All query parameters are optional. When none are provided, returns all
        active items ranked by trust score descending (max 25 results).

        Proximity scoring requires lat and lon together. radius defaults to
        50 000 m (50 km) when lat/lon are supplied without an explicit value.

        Places with a null location (the placeholder online places) are
        excluded when a geo filter is active but are included in text-only
        queries.
      parameters:
        - name: X-Cove-Uid
          in: header
          required: true
          description: Firebase UID injected by the upstream cove-api gateway.
          schema:
            type: string
        - name: q
          in: query
          required: false
          description: Free-text search term (PostgreSQL websearch_to_tsquery).
          schema:
            type: string
        - name: lat
          in: query
          required: false
          description: Latitude in decimal degrees. Must be paired with lon.
          schema:
            type: number
            format: double
        - name: lon
          in: query
          required: false
          description: Longitude in decimal degrees. Must be paired with lat.
          schema:
            type: number
            format: double
        - name: radius
          in: query
          required: false
          description: |
            Search radius in metres. Applies only when lat and lon are present.
            Defaults to 50 000 m when omitted.
          schema:
            type: number
            format: double
        - name: category
          in: query
          required: false
          description: |
            ltree path to scope results to a category subtree.
            Examples: "food.coffee", "food.coffee.whole_bean", "apparel".
          schema:
            type: string
      responses:
        "200":
          description: Discovery results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryResponse"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or empty X-Cove-Uid header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /categories:
    get:
      operationId: getCategories
      summary: Get category tree
      description: |
        Returns the full category tree (id, name, path, children) for the
        onboarding picker and browse surface. Results are ordered by ltree path.
      parameters:
        - name: X-Cove-Uid
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Category tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriesResponse"
        "401":
          description: Missing or empty X-Cove-Uid header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /items/{id}:
    get:
      operationId: getItem
      summary: Get item detail
      description: |
        Returns full item detail including: all fields, trust signals
        (item-level + producer-level + place-level), all places that
        carry the item, and signed imgproxy URLs for all five image variants
        across all media rows.
      parameters:
        - name: X-Cove-Uid
          in: header
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          description: Item UUID.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Item detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemDetail"
        "401":
          description: Missing or empty X-Cove-Uid header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Item not found or inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /producers/{id}:
    get:
      operationId: getProducer
      summary: Get producer detail
      description: |
        Returns producer detail including: profile fields, trust signals,
        and the list of places run by this producer.
      parameters:
        - name: X-Cove-Uid
          in: header
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          description: Producer UUID.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Producer detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProducerDetail"
        "401":
          description: Missing or empty X-Cove-Uid header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Producer not found or inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /places/{id}:
    get:
      operationId: getPlace
      summary: Get place detail
      description: |
        Returns place detail including: location, trust signals,
        and the list of items sold at this place.
      parameters:
        - name: X-Cove-Uid
          in: header
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          description: Place UUID.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Place detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceDetail"
        "401":
          description: Missing or empty X-Cove-Uid header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Place not found or inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        service:
          type: string
          example: cove-item
        status:
          type: string
          example: ok
        commit:
          type: string
          example: abc1234

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: item not found

    # ── Image schemas ────────────────────────────────────────────────────────

    ImageVariants:
      description: |
        Signed imgproxy URLs for the three list-view variants (thumb, sm, md).
        width and height are the source image dimensions in pixels.
      required: [width, height, thumb, sm, md]
      properties:
        width:
          type: integer
          description: Source image width in pixels.
          example: 800
        height:
          type: integer
          description: Source image height in pixels.
          example: 800
        thumb:
          type: string
          format: uri
          description: 200×200 crop — search result thumbnails, small grid (1×).
        sm:
          type: string
          format: uri
          description: 400×400 crop — list views (2×), avatar-like contexts.
        md:
          type: string
          format: uri
          description: 800×800 crop — detail hero (1×) / list views (3× Pro).

    ItemMedia:
      description: |
        One media item from the gallery, with signed URLs for all five variants.
        Used in item detail responses.
      required: [role, width, height, thumb, sm, md, lg, xl]
      properties:
        role:
          type: string
          enum: [primary, gallery]
        alt_text:
          type: string
        width:
          type: integer
          description: Source image width in pixels.
        height:
          type: integer
          description: Source image height in pixels.
        thumb:
          type: string
          format: uri
          description: 200×200 fill crop.
        sm:
          type: string
          format: uri
          description: 400×400 fill crop.
        md:
          type: string
          format: uri
          description: 800×800 fill crop.
        lg:
          type: string
          format: uri
          description: 1600×1600 fill crop.
        xl:
          type: string
          format: uri
          description: 3200×3200 fill crop — retina desktop / future web client.

    # ── Shared sub-schemas ───────────────────────────────────────────────────

    Signal:
      description: A trust signal attached to a producer, place, or item.
      required: [code, name, weight, status]
      properties:
        code:
          type: string
          example: b_corp
        name:
          type: string
          example: B Corp Certified
        description:
          type: string
        weight:
          type: number
          description: Signal weight (1–3). Higher = more credibility.
          example: 3
        status:
          type: string
          enum: [verified, pending, community_vouched]
          example: verified
        verified_at:
          type: string
          format: date-time
        cert_number:
          type: string

    ProducerSummary:
      required: [id, name, trust_score]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Onyx Coffee Lab
        trust_score:
          type: number
          example: 3

    PlaceSummary:
      required: [id, name, type]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [cafe, restaurant, bar, bakery, dessert_shop, shop, gallery, studio, market, venue, taproom, online]
          description: The online value is temporary, used only by the placeholder seed places.
          example: cafe
        distance_m:
          type: number
          description: |
            Distance in metres from the requested location.
            Absent when no geo params were provided.
          example: 1234.5
        listing_url:
          type: string
          format: uri

    # ── Discovery ────────────────────────────────────────────────────────────

    DiscoveryResult:
      required: [id, name, nearest_place, places, base_trust, score]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Southern Weather Blend
        description:
          type: string
        price_cents:
          type: integer
          example: 2300
        brand:
          type: string
          description: Plain brand name, set when the item's brand isn't a producer.
        producer:
          description: Absent for brand-only and secondhand items, which have no producer.
          $ref: "#/components/schemas/ProducerSummary"
        nearest_place:
          $ref: "#/components/schemas/PlaceSummary"
        places:
          type: array
          description: All places that sell this item ("Sold at").
          items:
            $ref: "#/components/schemas/PlaceSummary"
        primary_image:
          $ref: "#/components/schemas/ImageVariants"
        base_trust:
          type: number
          description: Producer trust score (0 when there is no producer) + nearest place trust score.
          example: 3
        score:
          type: number
          description: Blended ranking score (trust + relevance + proximity).
          example: 1.2

    DiscoveryResponse:
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/DiscoveryResult"

    # ── Categories ───────────────────────────────────────────────────────────

    CategoryNode:
      required: [id, name, path]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Whole Bean Coffee
        path:
          type: string
          description: ltree path (dot-delimited).
          example: food.coffee.whole_bean
        image_key:
          type: [string, "null"]
          description: |
            Garage object key for the category card image (~13:6 crop),
            e.g. "images/categories/card/food-coffee.jpg". Set on every
            category; omitted when absent.
          example: images/categories/card/food-coffee.jpg
        wide_image_key:
          type: [string, "null"]
          description: |
            Garage object key for the wide category image (4:1 crop) used by
            the onboarding interest cards, e.g. "images/categories/wide/food.jpg".
            Set only on top-level categories; omitted elsewhere.
          example: images/categories/wide/food.jpg
        children:
          type: array
          items:
            $ref: "#/components/schemas/CategoryNode"

    CategoriesResponse:
      required: [categories]
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CategoryNode"

    # ── Item detail ──────────────────────────────────────────────────────────

    PlaceDetailSummary:
      required: [id, name, type]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
        listing_url:
          type: string
          format: uri

    ItemDetail:
      required: [id, name, category_id, signals, places, media]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        price_cents:
          type: integer
        attributes:
          type: object
          description: Category-specific key-value attributes (flexible jsonb).
          additionalProperties: true
        details:
          type: object
          description: Rich display content (about text, origin info, tracklist, etc.).
          additionalProperties: true
        category_id:
          type: string
          format: uuid
        brand:
          type: string
          description: Plain brand name, set when the item's brand isn't a producer.
        producer:
          description: Absent for brand-only and secondhand items, which have no producer.
          $ref: "#/components/schemas/ProducerSummary"
        signals:
          type: array
          description: Trust signals from all three levels (item, producer, place).
          items:
            $ref: "#/components/schemas/Signal"
        places:
          type: array
          items:
            $ref: "#/components/schemas/PlaceDetailSummary"
        media:
          type: array
          description: Full gallery with all five signed variant URLs per image.
          items:
            $ref: "#/components/schemas/ItemMedia"

    # ── Producer detail ─────────────────────────────────────────────────────────

    ProducerPlace:
      required: [id, name, type]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
        slug:
          type: string

    ProducerDetail:
      required: [id, name, tier, trust_score, signals, places]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Onyx Coffee Lab
        description:
          type: string
        tier:
          type: string
          enum: [verified_business, individual_lister]
        trust_score:
          type: number
          example: 3
        city:
          type: string
        state:
          type: string
        website_url:
          type: string
          format: uri
        signals:
          type: array
          items:
            $ref: "#/components/schemas/Signal"
        places:
          type: array
          items:
            $ref: "#/components/schemas/ProducerPlace"

    # ── Place detail ────────────────────────────────────────────────────

    PlaceItem:
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        price_cents:
          type: integer
        listing_url:
          type: string
          format: uri
        image:
          $ref: "#/components/schemas/ImageVariants"

    PlaceDetail:
      required: [id, name, type, trust_score, signals, items]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [cafe, restaurant, bar, bakery, dessert_shop, shop, gallery, studio, market, venue, taproom, online]
        trust_score:
          type: number
        city:
          type: string
        state:
          type: string
        address:
          type: string
        website_url:
          type: string
          format: uri
        producer_id:
          type: string
          format: uuid
          description: The producer that runs this place, if any.
        producer_name:
          type: string
        signals:
          type: array
          items:
            $ref: "#/components/schemas/Signal"
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlaceItem"
