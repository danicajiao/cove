openapi: "3.1.0"

info:
  title: cove-media
  version: "0.1.0"
  description: |
    Image upload and processing service for Cove.
    Accepts multipart/form-data uploads, validates content type and size,
    derives a content-addressed object key, and stores images in Garage S3.

    Authentication: this service does NOT validate Firebase tokens directly.
    It trusts the X-Cove-Uid header injected by the upstream cove-api gateway.
    All endpoints (except /health) reject requests missing this header.

    Full spec (including imgproxy delivery endpoints) is tracked in issue #242.

servers:
  - url: http://cove-media.cove-media.svc.cluster.local:8080
    description: In-cluster (default)
  - url: http://localhost:8080
    description: Local development

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      description: |
        Returns service name, status, and Git commit SHA.
        Unauthenticated — used by Kubernetes liveness/readiness probes.
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /images/{filename}/url:
    get:
      operationId: getImageURL
      summary: Get a signed imgproxy URL for an image
      description: |
        Returns a short-lived signed URL that the client can follow to fetch a
        resized/re-encoded variant of the image directly from imgproxy.

        cove-media is not in the image bytes' hot path — it only generates the
        HMAC-SHA256 signature and returns the URL. The client fetches the image
        by following the URL, which is routed through the cove-api /i/* proxy
        to the in-cluster imgproxy service.

        The URL embeds an `exp:` imgproxy processing option so imgproxy will
        reject requests after `expires_at`. The default TTL is 1 hour
        (configurable via the IMGPROXY_URL_TTL environment variable).

        Choice rationale (signed-URL vs proxied-serve): the signed-URL approach
        keeps cove-media out of the image bytes' hot path and lets imgproxy serve
        directly, improving latency. Cloudflare caches the resized WebP responses
        at the edge, so subsequent requests for the same transform are free.
      parameters:
        - name: filename
          in: path
          required: true
          description: |
            Filename segment of the image key, e.g.
            `5069715ed40e20d8736d6d48ef9f84da8b240e1ead5ba28fdeb110d3d534105c.png`.
            The full object key is `images/<filename>`.
          schema:
            type: string
        - name: X-Cove-Uid
          in: header
          required: true
          description: Firebase UID injected by the upstream cove-api gateway.
          schema:
            type: string
        - name: w
          in: query
          required: true
          description: Output width in pixels (1–4096).
          schema:
            type: integer
            minimum: 1
            maximum: 4096
        - name: h
          in: query
          required: true
          description: Output height in pixels (1–4096).
          schema:
            type: integer
            minimum: 1
            maximum: 4096
        - name: fit
          in: query
          required: false
          description: |
            Resize mode. `cover` (default) scales and crops to fill the exact
            dimensions. `contain` scales to fit within the dimensions,
            preserving aspect ratio.
          schema:
            type: string
            enum: [cover, contain]
            default: cover
      responses:
        "200":
          description: Signed imgproxy URL generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageURLResponse"
        "400":
          description: Missing or invalid query params
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or empty X-Cove-Uid header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /images:
    post:
      operationId: uploadImage
      summary: Upload an image
      description: |
        Accepts a multipart/form-data upload with a required `file` part.
        Validates content type (jpeg, png, webp) and file size (max 10 MiB by default).

        Runs the normalization pipeline before storage:
        1. Auto-rotates from the EXIF orientation flag (corrects sideways phone photos)
        2. Strips all EXIF metadata including GPS coordinates
        3. Re-encodes as WebP at quality 90 (~40-60% smaller than JPEG)
        4. Derives a content-addressed key from SHA-256 of the normalized bytes

        Idempotent: uploading the same image twice returns the same key.
        HEIC is not accepted — convert to JPEG on-device before uploading.
      parameters:
        - name: X-Cove-Uid
          in: header
          required: true
          description: Firebase UID injected by the upstream cove-api gateway.
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Image file to upload (jpeg, png, or webp; max 10 MiB).
                product_id:
                  type: string
                  description: Optional product ID to associate with the image.
                variant:
                  type: string
                  description: Optional variant label (e.g. "front", "back", "detail").
      responses:
        "201":
          description: Image stored successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          description: Missing or invalid file field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or empty X-Cove-Uid header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: File exceeds the maximum allowed size
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Unsupported content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error (e.g. S3 write failure)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        service:
          type: string
          example: cove-media
        status:
          type: string
          example: ok
        commit:
          type: string
          example: "abc1234"

    ImageURLResponse:
      type: object
      required:
        - url
        - expires_at
      properties:
        url:
          type: string
          description: |
            Signed imgproxy URL. The client follows this URL to fetch the
            resized/re-encoded image. Valid until `expires_at`.
          example: "https://api.coveapp.dev/i/abc123sig.../exp:1748129400/rs:fill:600:600/plain/s3://cove-media/images/5069...png@webp"
        expires_at:
          type: string
          format: date-time
          description: RFC 3339 timestamp after which the URL is no longer valid.
          example: "2026-05-24T23:00:00Z"

    UploadResponse:
      type: object
      required:
        - key
        - width
        - height
      properties:
        key:
          type: string
          description: |
            Content-addressed Garage object key: "images/<sha256hex>.webp".
            The SHA-256 is computed over the normalized WebP bytes.
            Store this value as `media_key` in product.media.
          example: "images/e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855.webp"
        width:
          type: integer
          description: |
            Image width in pixels after normalization and auto-rotation.
            Store alongside the key in product.media for layout hints —
            clients use source dimensions to reserve space before the image loads.
          example: 3024
        height:
          type: integer
          description: |
            Image height in pixels after normalization and auto-rotation.
          example: 4032

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: "unsupported content type \"image/gif\"; must be image/jpeg, image/png, or image/webp"
